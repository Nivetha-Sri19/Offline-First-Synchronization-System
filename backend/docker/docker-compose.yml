services:
  mysql:
    image: mysql:8.0
    container_name: offline_sync_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: offline_sync
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - offline_sync_network

  redis:
    image: redis:7-alpine
    container_name: offline_sync_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - offline_sync_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: offline_sync_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: mysql+pymysql://root:${Dilli%401998}@mysql:3307/offline_sync
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - offline_sync_network

volumes:
  mysql_data:
  redis_data:

networks:
  offline_sync_network:
    driver: bridge